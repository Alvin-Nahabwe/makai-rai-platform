name: CI

# Runs on every push (every branch, not just main) and every pull request.
#
# Scoped this way on purpose: D-146 (docs/DEFERRED_REGISTER.md) is not "main
# has no CI", it is "nothing runs the guards this project already wrote
# unless a person remembers to" -- and the concrete example that row cites is
# `npm run lint` failing on a PHASE BRANCH for days before anyone checked. A
# workflow scoped only to `main` would not have caught that; it would only
# ever see code after it already merged. `pull_request` is kept alongside
# `push` (rather than relied on alone) so a branch worked on directly, with
# no PR open yet, still gets feedback on every push.
#
# `schedule` runs the whole workflow once a day (04:23 UTC, off the :00 and
# :30 marks everyone else picks) on the default branch. A push-only audit is
# blind in exactly the weeks nobody pushes: an advisory published on a quiet
# Tuesday waits for the next commit to be noticed. The daily run is what turns
# the audit step below from "checked when someone pushes" into surveillance.
# Its last step pings a dead-man check, so a schedule that stops firing is
# itself reported (see `Ping the dead-man check`).
#
# `workflow_dispatch` is the manual trigger: `gh workflow run ci.yml`. It runs
# the same jobs but does not ping, because only a scheduled run is evidence
# that the schedule is alive.
on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

# Least privilege: the workflow default is read-only. The checks only read
# the repo and run tests, so the default GITHUB_TOKEN (read/write) is narrowed
# to `contents: read`. (env-secrets-manager / senior-security preventive pass
# -- see the install report for the full threat-model notes.)
#
# One scheduled job is the exception: `security-txt-renewal`, below, has its
# own job-level `contents: write` and `pull-requests: write`, so it can push a
# branch and open a PR. That is the named P1 exception in
# __tests__/lint/release-and-deploy.test.ts. No other job here pushes commits,
# comments on PRs, or touches releases, and none of them inherits a write.
permissions:
  contents: read

# Cancel a superseded run of the same event on the same ref -- a second
# push to a branch, or a new commit on an open pull request -- rather than
# letting both finish. A push and its pull_request run are not merged:
# their `github.ref` differs (refs/heads/... vs refs/pull/N/merge), so
# both run.
#
# The event name is part of the group so that a scheduled run, a push and a
# manual run on the same ref never cancel one another. A push to `main` that
# landed during the daily run would otherwise cancel it, and the `always()`
# dead-man ping at the end of `verify` would then report `/fail` for a run in
# which nothing was wrong. A superseded run of the SAME kind is still
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    # A genuine hang (a stuck test, a psql invocation waiting on a TTY
    # prompt it will never get) should fail loudly, not run until GitHub's
    # own 360-minute default cap. Generous relative to the actual expected
    # runtime (vitest.config.ts's own comment: the suite runs in ~2s) so
    # this is a backstop, not a tight budget to tune.
    timeout-minutes: 15

    # Single source of truth for the three Postgres primitives, referenced
    # below by BOTH the service container definition and the provisioning
    # step -- rather than three matching literals with nothing but a
    # comment holding them in sync. DATABASE_URL is still written out as an
    # explicit connection string (not composed from the three via a
    # `format()` expression): at three short, stable, already-public
    # dev/CI-only values, composing it would trade a small amount of
    # duplication for a less readable expression -- not a clear win.
    env:
      POSTGRES_USER: makrai
      POSTGRES_PASSWORD: makrai_dev_password
      POSTGRES_DB: makrai_test
      DATABASE_URL: postgresql://makrai:makrai_dev_password@localhost:5432/makrai_test

    services:
      postgres:
        # Same image and superuser name as docker/docker-compose.yml (local
        # dev) and every migration/script that assumes a role called
        # "makrai" -- see the migration comments in
        # prisma/migrations/20260803074244_enable_rls_and_guard_trigger and
        # .../20260803140500_guard_views_and_narrow_default_privileges for
        # why: CREATE EVENT TRIGGER is superuser-only with no GRANTable
        # alternative (D-079), and the postgres image makes POSTGRES_USER a
        # real database superuser on first boot -- no extra bootstrapping
        # needed to get one in CI.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          # Creates "makrai_test" directly at container startup -- the only
          # database this job needs. This pipeline never starts the app (no
          # `next dev`/`next start`, no e2e), and
          # `__tests__/helpers/db.ts#resetDb` hard-refuses to run against
          # anything but "makrai_test", so the interactive-dev database
          # ("makrai") has no reader here at all. Local dev's
          # `npm run db:provision` still provisions both, for a developer
          # who runs the app against "makrai" directly.
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        # GitHub Actions blocks the whole job from starting its steps until
        # this health check passes -- by the time "Checkout" runs, Postgres
        # is already up AND has finished creating POSTGRES_DB (the official
        # image's entrypoint runs init before the server starts accepting
        # the connections this check makes). That is the actual "wait for
        # Postgres" mechanism; a separate pg_isready step earlier in the job
        # would only be able to re-check something already guaranteed, so
        # none is added. Same interval/timeout/retries as
        # docker/docker-compose.yml's own healthcheck -- no reason to run a
        # different check here than the one local dev already relies on.
        # NOTE: literal "makrai" here, not ${{ env.POSTGRES_USER }} -- unlike
        # services.<id>.env (below) and steps.env (used further down for the
        # provisioning step), the `env` context is not available inside
        # `options` (confirmed with actionlint: "context env is not allowed
        # here"). Kept in sync with POSTGRES_USER above by comment, not by
        # mechanism -- the same trade-off already made for DATABASE_URL.
        options: >-
          --health-cmd="pg_isready -U makrai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Reads .nvmrc rather than restating it, so this cannot drift
          # from local dev or the Dockerfile's FROM tag (D-192).
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        # Not optional, and not named in the original task order: verified
        # directly against the installed packages
        # (node_modules/prisma/package.json,
        # node_modules/@prisma/client/package.json) that neither carries a
        # `postinstall` hook in this Prisma 7 install -- older Prisma
        # versions generated the client automatically as an `npm install`
        # side effect; this one does not. Without this step, `tsc --noEmit`,
        # `vitest run` and `next build` all fail: every one of them imports
        # from the generated `@prisma/client`, and `prisma migrate deploy`
        # deliberately does not generate as a side effect (unlike
        # `migrate dev`) -- Prisma's own docs recommend calling `generate`
        # explicitly in deploy pipelines for exactly this reason.
        run: npx prisma generate

      # Lint and typecheck need no database, only the generated client above
      # -- so they run before the two Postgres-dependent steps below and
      # fail fast and cheaply on the far more common class of failure
      # (a syntax/type error) before this job pays for 14 migrations and a
      # role-provisioning step. Verified, not assumed: eslint.config.mjs
      # only pulls in eslint-config-next's non-type-checked configs plus
      # this repo's own syntactic rules, so Lint touches no database either.
      - name: Lint
        run: npm run lint

      # Dependency-vulnerability surveillance. Until 2026-08-18 nothing here,
      # in the decision register, or in any bot watched for advisories, so a
      # critical chain in @auth/core -- the library the whole authentication
      # system rests on -- sat unnoticed for four weeks after its fix shipped.
      #
      # --omit=dev because the question is "does the DEPLOYED artifact carry a
      # known vulnerability", and dev tooling is not deployed.
      #
      # Threshold is `critical`, not `high`, and the reason is measured rather
      # than cautious. At `high` this gate fails today on exactly four
      # advisories -- prisma, @prisma/config, deepmerge-ts, fast-uri -- every
      # one of them in Prisma's local dev tooling, which reaches an --omit=dev
      # audit only because the production @prisma/client depends on prisma.
      # None is in the shipped bundle: after a build, none appears under
      # .next/standalone/node_modules, which is what the Docker image copies.
      # A gate that is red on the day it is added gets switched off, and one
      # that blocks on code that never deploys is measuring the wrong thing.
      # `critical` would still have caught the @auth/core chain that motivated
      # this step.
      #
      # Raise this to `high` once Prisma's dependency chain clears, and treat
      # that as the goal rather than the status quo.
      #
      # NOT a silent tolerance: when this fails, read the advisory and decide.
      # The two ways past it are upgrading, or recording a register row with
      # the reason and a pick-up trigger.
      #
      # Runs on the daily schedule as well as on every push (see `on:` above),
      # and a red scheduled run is reported through the dead-man ping that ends
      # this job.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations (as superuser)
        # Four migrations run CREATE ROLE / CREATE EVENT TRIGGER / ALTER
        # DEFAULT PRIVILEGES and are superuser-only with no GRANTable
        # alternative (D-079) -- DATABASE_URL above already connects as
        # "makrai", the role the postgres image made a superuser at
        # startup.
        run: npx prisma migrate deploy

      - name: Provision the makrai_app and makrai_identity role passwords
        # scripts/provision-app-db-role.sh, once per role (ADR-0009). Its
        # SQL is never built by string interpolation -- the password goes
        # to psql on stdin as a variable; see the script's own comment.
        # Only HOW it reaches psql is overridable, and this is the one place
        # that override is used: the script's default assumes a local
        # `docker-postgres-1` container to `docker exec` into, which does
        # not exist here -- this is a service container reached over TCP,
        # which needs a password (see the script's own PSQL_CMD comment for
        # why trust-auth doesn't cover this path). PGPASSWORD's value is the
        # same well-known, already-public local-dev value as
        # POSTGRES_PASSWORD above, not a real secret.
        run: |
          scripts/provision-app-db-role.sh makrai_test makrai_app
          scripts/provision-app-db-role.sh makrai_test makrai_identity
        env:
          PSQL_CMD: psql -h localhost -p 5432 -U ${{ env.POSTGRES_USER }}
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
          # APP_DB_PASSWORD and IDENTITY_DB_PASSWORD deliberately left
          # UNSET: the script's dev defaults ('app_dev_password',
          # 'identity_dev_password') are exactly what vitest.config.ts's
          # TEST_APP_DATABASE_URL / TEST_IDENTITY_DATABASE_URL defaults
          # expect. The script refuses them without this flag, whatever
          # NODE_ENV says (D-076), so a CI database has to ask for them.
          ALLOW_DEV_DB_PASSWORD: '1'

      - name: Unit + integration tests
        # DATABASE_URL (job-level, above) matches vitest.config.ts's own
        # TEST_DATABASE_URL default exactly
        # (postgresql://makrai:makrai_dev_password@localhost:5432/makrai_test),
        # so no override is needed here: that config only reads
        # TEST_DATABASE_URL/TEST_APP_DATABASE_URL (not
        # DATABASE_URL/APP_DATABASE_URL directly), falling back to
        # identical literals when those are unset.
        run: npm test

      - name: Build
        run: mkdir -p test-results && set -o pipefail && npm run build 2>&1 | tee test-results/build.log
        # The log is kept in test-results/ (gitignored, never uploaded) for the
        # next step; `tee` keeps it in the Actions log too, and pipefail keeps a
        # failed build failing this step.
        #
        # No DATABASE_URL override needed here even though the job-level
        # value above is still in scope: Plan 1c's lazy-init fix
        # (lib/data/connection.ts's hmrSingleton) means `next build` no
        # longer opens a database connection at import/page-data-collection
        # time, so this step does not depend on DATABASE_URL pointing
        # anywhere real -- verified during Plan 1c to also succeed with no
        # DATABASE_URL set at all ("absent-or-present-and-valid").
        #
        # `next build` also re-typechecks the whole project internally
        # (typescript.ignoreBuildErrors defaults to false, and
        # next.config.ts does not set it) -- genuinely redundant with the
        # dedicated Typecheck step above under THIS job's ordering.
        # Deliberately NOT silenced via ignoreBuildErrors: that setting is
        # read by every `next build` invocation, including
        # docker/Dockerfile's production image build, which runs
        # `npm run build` with no separate tsc gate anywhere in that file
        # (checked directly). Turning it off here would remove Next.js's
        # only type-check from the actual shipped-image build to save a few
        # seconds of CI time -- a worse trade than the duplication it would
        # remove.

      # A content read through a computed path makes the build trace the whole
      # project, which would put .env files, tests and source into
      # .next/standalone and from there into the production image (contract
      # "Static read paths", finding SEC-01). This fails the job when the build
      # log says so, or when the standalone tree holds a test path, an .env*
      # file or a .ts or .tsx file under app/, lib/ or components/.
      - name: Check the standalone output
        run: node scripts/check-standalone.mjs test-results/build.log

      # NFR-PERF-01: first-load JavaScript is at most 160 KB gzip for a public
      # page and 190 KB for a signed-in one. This measures every route of the
      # build just made and fails above the budget. It stays after the check
      # above, which must follow "Build" directly (check-standalone.test.ts).
      # scripts/first-load-exceptions.json lists the routes allowed over their
      # budget; the release candidate's run refuses any entry.
      - name: Measure first-load JavaScript
        run: node scripts/measure_first_load.mjs .next

      # Dead-man check for the daily audit. The check expects a ping at least
      # once a day: a success ping while the job is green, a `/fail` ping when
      # it is not, and NOTHING when the schedule has stopped firing -- which is
      # the case this step exists for, because a job that never runs looks
      # exactly like a job that passes. Silence raises the alarm, so a disabled
      # workflow, a removed trigger or a runner outage cannot go unnoticed.
      #
      # The check is Simple, period 1 day, grace 36 h, not a cron time. GitHub's
      # schedule is best-effort and its delay has no bound (the 04:23 slot has
      # landed between 09:35 and 12:09 UTC), so the 36 h grace absorbs a late
      # run, or a dropped day, and silence is reported about 60 h after the last
      # ping. `/fail` is not delayed by the grace: a failing audit alerts the
      # moment the run lands.
      #
      # Last in the job, with `always()`, so `job.status` carries the verdict of
      # every step before it -- the audit above included -- and a failed audit
      # still reports instead of skipping its own report. Scheduled runs only:
      # a push or a manual run says nothing about whether the schedule is alive.
      #
      # The URL is the check's secret (anyone holding it can mark the check
      # up), so it reaches the script as an environment variable and is never
      # interpolated into the script text. If HC_CI_AUDIT_PING_URL is unset the
      # curl fails and so does the run: the dead-man check is not allowed to
      # fail quietly. Flags match the project's other ping scripts
      # (docs/runbooks/backup-restore.md).
      - name: Ping the dead-man check
        if: always() && github.event_name == 'schedule'
        env:
          HC_URL: ${{ secrets.HC_CI_AUDIT_PING_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            url="$HC_URL"
          else
            url="$HC_URL/fail"
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$url"

  # Keeps public/.well-known/security.txt from going stale (G2-22, G2-10, M0-01).
  #
  # RFC 9116 treats a security.txt past its `Expires` as stale, and a date that is moved by hand
  # lapses on the one day nobody remembers. This job runs on the daily schedule only: it runs
  # scripts/renew-security-txt.mjs, which moves `Expires` to a year out when fewer than 30 days
  # remain and otherwise leaves the file alone, and then opens a pull request if the file changed.
  # A pull request, not a push: main is protected, and a person merges the new date.
  #
  # It is the one job in this repository other than release.yml#release that can write (P1,
  # __tests__/lint/release-and-deploy.test.ts names it), so it is kept narrow on purpose:
  #   - `contents: write` pushes the branch and `pull-requests: write` opens the PR. Nothing else.
  #   - The only action is actions/checkout, pinned by SHA. No setup-node, no `npm ci`, nothing
  #     fetched: the script uses Node built-ins and runs on the runner's own Node, so no package
  #     code runs while the token is on the runner.
  #   - GITHUB_TOKEN reaches only the step that pushes and opens the PR, through `env` and not
  #     through an expression in the script. Checkout is told not to leave the token in .git/config,
  #     so the step that runs the script holds none. The push step hands it to git through
  #     `gh auth setup-git`.
  #   - No `needs: verify`: a red audit must not stop the date from moving, and a red renewal must
  #     not hide behind a green verify.
  #
  # A pull request opened with GITHUB_TOKEN does not start any workflow, so its required checks do
  # not run. Close it and reopen it, and they do. The repository setting "Allow GitHub Actions to
  # create and approve pull requests" must be on, or the `gh pr create` below is refused.
  #
  # A failure here is a failed scheduled run of this workflow, the same signal the dead-man ping
  # in `verify` does not cover and the red-main issue (Task 33) does.
  security-txt-renewal:
    name: renew security.txt Expires
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Move Expires out when fewer than 30 days remain
        run: node scripts/renew-security-txt.mjs

      # One branch name, force-pushed: if yesterday's PR is still waiting to be merged, today's run
      # moves its branch to today's date and does not open a second PR.
      - name: Open a pull request if the file changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          file=public/.well-known/security.txt
          branch=chore/renew-security-txt
          if git diff --quiet -- "$file"; then
            echo "Expires has 30 or more days left; no pull request to open."
            exit 0
          fi
          gh auth setup-git --hostname github.com
          git switch -c "$branch"
          git add -- "$file"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: renew the security.txt Expires date'
          git push --force origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A renewal pull request is already open; its branch now carries the new date."
            exit 0
          fi
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title 'chore: renew the security.txt Expires date' \
            --body 'The Expires date in public/.well-known/security.txt had fewer than 30 days left. This moves it out by a year (scripts/renew-security-txt.mjs). This pull request was opened with GITHUB_TOKEN, so no checks have started: close it and reopen it to run them.'

  test-e2e:
    name: e2e
    runs-on: ubuntu-latest
    # `verify` (above) budgets 15 min for lint+typecheck+test+build against
    # no browser and no server. This job does all of that PLUS installs a
    # real browser and its OS deps (`playwright install --with-deps`) and
    # drives ~20 real logins through the actual `/login` form and NextAuth's
    # credentials provider once (see the "Build e2e fixture" and "Run e2e
    # suite" steps below for why Playwright is still invoked twice even
    # though those logins now happen only once). 30 min is a backstop for a
    # genuine hang, not a tight budget to tune, same rationale as `verify`'s
    # own timeout comment above.
    timeout-minutes: 30

    # Mirrors `verify`'s env block above (job-level env is not inherited
    # across jobs in GitHub Actions, so this cannot simply reference it) plus
    # the additional values this job's app process needs to actually boot
    # and serve requests, each cited against where it throws if unset.
    env:
      POSTGRES_USER: makrai
      POSTGRES_PASSWORD: makrai_dev_password
      POSTGRES_DB: makrai_test
      DATABASE_URL: postgresql://makrai:makrai_dev_password@localhost:5432/makrai_test
      # lib/data/tenant.ts:125 -- throws if unset. `makrai_app`/
      # `app_dev_password` is scripts/provision-app-db-role.sh's own
      # local-dev/CI default (provisioned below with
      # ALLOW_DEV_DB_PASSWORD=1), matching vitest.config.ts's
      # TEST_APP_DATABASE_URL default exactly -- not a value invented here.
      APP_DATABASE_URL: postgresql://makrai_app:app_dev_password@localhost:5432/makrai_test
      # The identity lane (ADR-0009): lib/data/identity.ts and
      # lib/data/preauth.ts throw if unset, and instrumentation.ts refuses
      # to start the server if it names a superuser. Sign-in, registration,
      # invitation acceptance and organisation creation all run on it, so
      # this job's login fixture is its first real exercise. Same
      # provenance as APP_DATABASE_URL above: the script's
      # `identity_dev_password` default and vitest.config.ts's
      # TEST_IDENTITY_DATABASE_URL default.
      IDENTITY_DATABASE_URL: postgresql://makrai_identity:identity_dev_password@localhost:5432/makrai_test
      # NEXTAUTH_SECRET is not set here: lib/auth/secret.ts:44-49 throws when it
      # is unset or empty, and it is generated at run time by the
      # `Generate NEXTAUTH_SECRET` step below instead of being a constant.
      # app/api/v1/orgs/[slug]/members/route.ts:105-108 -- throws if unset.
      # W-1 (task-5-brief.md): an unset value here would make the invite
      # POST short-circuit on THIS check before ever reaching Task 3's
      # RESEND_API_KEY mechanism, silently satisfying D-188's fix without
      # exercising it. Any syntactically-plausible address works -- no real
      # inbox is needed, since playwright.config.ts's webServer.env blanks
      # RESEND_API_KEY and lib/email/send.ts:32-37 throws locally before any
      # network call.
      EMAIL_FROM_ADDRESS: ci@example.test
      # app/(public)/register/page.tsx:23 and app/api/auth/register/route.ts:25
      # both gate on lib/auth/openRegistration.ts, which reads this variable and
      # defaults to CLOSED. Production runs closed on purpose (PLAN.md:217 keeps
      # registration invite-gated until T3), and this job must not change that --
      # it sets the variable for the CI server only.
      #
      # Without it the `e2e` job is red on main. Not hypothetically: runs
      # 33367539265 and 33368764357 both failed here, across auth.spec.ts,
      # org-routing.spec.ts, project.spec.ts, security.spec.ts and three more --
      # every spec that drives the /register PAGE. With the flag unset that page
      # renders "Registration is by invitation" and no form at all, so
      # `page.fill('#email', ...)` has nothing to fill.
      #
      # The `setup` project kept passing throughout, which is why this hid: the
      # 20-seat fixture (__tests__/helpers/fixture.ts:22-28) calls
      # `bootstrapOrgWithOwner` -- the FUNCTION `/api/auth/register` calls -- not
      # the HTTP route, so it never crosses the gate.
      #
      # Coverage of the CLOSED posture is not lost by setting this: it lives in
      # __tests__/unit/open-registration-gate.test.ts, which runs in the `verify`
      # job and does not read this variable from here.
      #
      # Reaches the Next server: playwright.config.ts (the comment on `webServer.env`) records that Playwright
      # merges `...process.env` into webServer.env, and its own `env` key overrides
      # RESEND_API_KEY only.
      ALLOW_OPEN_REGISTRATION: 'true'
      # NOT part of the brief's own read/write table -- found empirically
      # while confirming this job's server can complete a login at all, not
      # assumed from reading source alone. `npm run start` runs `next
      # start`, which sets NODE_ENV=production internally whenever NODE_ENV
      # is not already set (node_modules/next/dist/bin/next:47,66:
      # `defaultEnv` is 'production' for every subcommand but `dev`).
      # @auth/core's own trustHost default
      # (node_modules/@auth/core/lib/utils/env.js:40-44) is
      # `!!(AUTH_URL ?? AUTH_TRUST_HOST ?? VERCEL ?? CF_PAGES ?? NODE_ENV
      # !== "production")` -- note it reads AUTH_URL, NOT NEXTAUTH_URL, so
      # setting NEXTAUTH_URL alone does not help here. With NODE_ENV=
      # production and none of those set, trustHost defaults false and
      # every auth request throws UntrustedHost
      # (node_modules/@auth/core/lib/utils/assert.js:57).
      # Reproduced live: a real `npm run build && npm run start` under this
      # exact env minus this line made `GET /api/auth/csrf` return HTTP 500
      # (`"There was a problem with the server configuration..."`) with
      # `[auth][error] UntrustedHost: Host must be trusted.` in the server
      # log; adding only `AUTH_TRUST_HOST=true` (no NEXTAUTH_URL) made the
      # same request return HTTP 200 with a real CSRF token. `next dev`
      # (local, non-CI) never hits this: NODE_ENV=development there
      # defaults trustHost true by the same expression, which is why no
      # existing spec or local run surfaced it.
      AUTH_TRUST_HOST: 'true'
      # lib/publicOrigin.ts THROWS when neither AUTH_URL nor NEXTAUTH_URL is
      # set. app/api/v1/orgs/[slug]/members/route.ts:105 calls it to mint the
      # invitation acceptUrl, so without this the invite POST 500s with a
      # non-JSON body and two-orgs.spec.ts:76 fails on "Unexpected end of JSON
      # input" -- a message naming neither the variable nor the route. Observed
      # on run 33374753014, not predicted.
      #
      # NEXTAUTH_URL, deliberately NOT AUTH_URL: the comment above records that
      # @auth/core's trustHost default reads AUTH_URL and ignores NEXTAUTH_URL,
      # so this satisfies publicOrigin without quietly taking over the job that
      # AUTH_TRUST_HOST is doing one line up.
      #
      # Must stay equal to playwright.config.ts's baseURL -- a valid but wrong
      # origin would mint links to a host the test browser never visits, which
      # passes green while shipping the dead-link bug publicOrigin exists to
      # prevent. __tests__/lint/ci-env-completeness.test.ts pins the two together.
      NEXTAUTH_URL: 'http://localhost:3000'

    services:
      postgres:
        # Same image/health-check shape as `verify`'s service above; see
        # that block's comments for the superuser/CREATE EVENT TRIGGER
        # rationale (D-079), which applies identically here.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U makrai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        # Same reason as `verify`'s identical step above: this Prisma 7
        # install has no `postinstall` client-generation hook.
        run: npx prisma generate

      - name: Apply migrations (as superuser)
        # Same command as `verify`. Also the writer for the `fv_3_0_0`
        # FrameworkVersion row that every `assessments.frameworkVersionId`
        # foreign key depends on -- inserted by
        # prisma/migrations/20260807102031_framework_registry_and_pin/migration.sql,
        # not by a separate seed step.
        run: npx prisma migrate deploy

      - name: Provision the makrai_app and makrai_identity role passwords
        # Same command/env shape as `verify`'s identical step; see that
        # step's comment for why PSQL_CMD/PGPASSWORD are overridden this way
        # in CI (no local `docker-postgres-1` container to exec into), why
        # the password variables are left unset, and why the flag is needed.
        run: |
          scripts/provision-app-db-role.sh makrai_test makrai_app
          scripts/provision-app-db-role.sh makrai_test makrai_identity
        env:
          PSQL_CMD: psql -h localhost -p 5432 -U ${{ env.POSTGRES_USER }}
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
          ALLOW_DEV_DB_PASSWORD: '1'

      # The session-signing secret, generated for this run and used by no other.
      # It used to be a constant committed to this file; a constant is a
      # credential that never rotates and is readable by everyone who can read
      # the repository, and the only thing the e2e job needs of it is that it be
      # non-empty. @auth/core derives the signing/encryption key via HKDF
      # (node_modules/@auth/core/jwt.js:122, `hkdf("sha256", keyMaterial, salt,
      # ...)`), which has no minimum input-length check on that path -- checked
      # directly, not assumed -- so 32 random bytes are ample.
      #
      # `$GITHUB_ENV` makes it visible to every later step in this job, so the
      # build, the fixture step and the server Playwright starts all see the
      # same value (Playwright merges `...process.env` into webServer.env,
      # playwright.config.ts, the comment on `webServer.env`). It must therefore come before the first of
      # them. The job-level `env:` above cannot hold it: that block is static
      # text, and a random value has to be computed.
      #
      # Masked BEFORE it is written, so no later line of the log can show it. The
      # only line that carries the value is the `::add-mask::` command itself,
      # which the runner consumes and masks as it reads it.
      - name: Generate NEXTAUTH_SECRET
        run: |
          v=$(openssl rand -base64 32)
          echo "::add-mask::$v"
          echo "NEXTAUTH_SECRET=$v" >> "$GITHUB_ENV"

      - name: Build
        # Playwright owns the server (playwright.config.ts's `webServer`,
        # Task 1) and, in CI, spawns it with `npm run start` -- which needs
        # this build to already exist. This job must NOT start its own
        # server: `reuseExistingServer` is `false` in CI
        # (playwright.config.ts, `reuseExistingServer`, `false` in `webServer`), so a server already occupying port 3000
        # makes Playwright's own port check throw
        # (node_modules/playwright/lib/runner/index.js:821-827).
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build e2e fixture (Playwright 'setup' project)
        # Task 10's `setup` project (playwright.config.ts, the `projects` list) builds the
        # shared 2-org x 5-role x 2-member fixture and saves 20
        # `storageState` files under the gitignored e2e/fixtures/.auth/.
        # Several specs read e2e/fixtures/manifest.json at MODULE SCOPE, so
        # without this step collection itself dies with ENOENT before any
        # test runs -- verified: `npx playwright test --project=setup
        # --list` exits 0 on a cold checkout; a bare `npx playwright test
        # --list` exits 1.
        run: npx playwright test --project=setup

      - name: Run e2e suite
        # Two invocations are still needed, not one: the `setup` project
        # (previous step) creates the gitignored e2e/fixtures/manifest.json
        # that several specs read at MODULE SCOPE, so collection itself
        # dies with ENOENT before any test runs without it having gone
        # first (see that step's own comment). --project=chromium --no-deps
        # skips re-running `setup` here: `dependencies: ['setup']`
        # (playwright.config.ts, the `chromium` project's `dependencies`) would otherwise make Playwright
        # re-execute it before `chromium` -- ~20 avoidable logins -- but
        # --no-deps (node_modules/playwright/lib/program.js:189, "Do not
        # run project dependencies") is safe because the previous step
        # already left every artifact that dependency would have produced
        # (manifest.json + 20 storageState files) on disk in this same job.
        # Verified live, not assumed: with this flag, a real run still
        # reports 48 passed / 1 skipped and `setup` appears in the run's
        # own output exactly once, not twice.
        # --fail-on-flaky-tests (present in this installed version:
        # node_modules/playwright/lib/program.js:177, enforced at
        # node_modules/playwright/lib/runner/index.js:5823) is required, not
        # optional: without it, `retries: 2` (playwright.config.ts, `retries`) means
        # a test that only passes on a retry still reports the RUN as
        # green, measured elsewhere at 96.3% green with a flake fully alive.
        # "Green" here means zero retries consumed.
        run: npx playwright test --project=chromium --no-deps --fail-on-flaky-tests

      # NFR-AVL-04's fault harness: stops the Postgres service container, checks
      # that pages and writes answer with a support reference and that the log
      # holds one line for each, starts it again and checks the data survived
      # (e2e/db-outage.spec.ts). It runs alone, after the suite, because it takes
      # the database away from every other test; --no-deps reuses the fixture the
      # "Build e2e fixture" step left on disk, as the suite's step above does.
      - name: Run the database outage test
        run: E2E_DB_CONTAINER=$(docker ps -q --filter ancestor=postgres:16-alpine) npx playwright test --project=outage --no-deps

      # The web server's output goes to test-results/server.log and no longer
      # reaches this log (playwright.config.ts, the comment on
      # `webServer.command`), so a red run would lose it. The file is the
      # server output of the last Playwright invocation of this job, because
      # each invocation deletes test-results/ before it starts the server.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/server.log
          retention-days: 7

# THIS JOB IS A REQUIRED STATUS CHECK on `main`, as of 2026-08-12 (D-203).
# Branch protection requires both `lint, typecheck, test, build` and `e2e`,
# with enforce_admins on -- so there is no override, and a red run here
# blocks every merge. Verified by attempting the thing it prevents: a direct
# push to `main` was refused with "2 of 2 required status checks are
# expected". D-203 records the demotion path if this check ever starts
# blocking correct work rather than catching incorrect work.
#
# (The comment previously here said the opposite -- that the job was
# deliberately not required, and that D-195 was still open and must be
# resolved first. Both were true when written and became false in the same
# branch. Corrected at the Phase 1d-i C6 exit, where the security review
# caught the file describing itself wrongly.)
#
# D-185's `test.fixme()` quarantine on e2e/assessment-flow.spec.ts REMAINS in
# place, so the assessment happy path -- create, answer, complete, report,
# download PDF -- is NOT covered by this gate. Its root cause is now known
# (a stale assessment GET response overwrites recorded answers) and is
# recorded in that row; the fix has no owner yet.
#
# One coupling to know before changing how the rate limiter derives a client
# IP (D-199): e2e/fixtures/auth.setup.ts gives each of its 20 seats a
# synthetic `x-forwarded-for` precisely because `POST:/api/auth` caps at 15
# per identifier. Making the limiter ignore that header -- which is D-199's
# whole point -- collapses all 20 logins onto one identifier in CI, kills the
# fixture at login 16, and fails every test in this job. See D-199.
