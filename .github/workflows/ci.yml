name: CI

# Runs on every push (every branch, not just main) and every pull request.
#
# Scoped this way on purpose: D-146 (docs/DEFERRED_REGISTER.md) is not "main
# has no CI", it is "nothing runs the guards this project already wrote
# unless a person remembers to" -- and the concrete example that row cites is
# `npm run lint` failing on a PHASE BRANCH for days before anyone checked. A
# workflow scoped only to `main` would not have caught that; it would only
# ever see code after it already merged. `pull_request` is kept alongside
# `push` (rather than relied on alone) so a branch worked on directly, with
# no PR open yet, still gets feedback on every push.
on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repo and runs checks. It
# never pushes commits, comments on PRs, or touches releases, so the default
# GITHUB_TOKEN (read/write) is narrowed to read-only. (env-secrets-manager /
# senior-security preventive pass -- see the install report for the full
# threat-model notes.)
permissions:
  contents: read

# Cancel a superseded run on the same branch/PR rather than letting both
# finish -- `push` and `pull_request` both fire for the same commit on an
# open PR, so without this every PR push runs the whole job twice in
# parallel for no benefit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    # A genuine hang (a stuck test, a psql invocation waiting on a TTY
    # prompt it will never get) should fail loudly, not run until GitHub's
    # own 360-minute default cap. Generous relative to the actual expected
    # runtime (vitest.config.ts's own comment: the suite runs in ~2s) so
    # this is a backstop, not a tight budget to tune.
    timeout-minutes: 15

    # Single source of truth for the three Postgres primitives, referenced
    # below by BOTH the service container definition and the provisioning
    # step -- rather than three matching literals with nothing but a
    # comment holding them in sync. DATABASE_URL is still written out as an
    # explicit connection string (not composed from the three via a
    # `format()` expression): at three short, stable, already-public
    # dev/CI-only values, composing it would trade a small amount of
    # duplication for a less readable expression -- not a clear win.
    env:
      POSTGRES_USER: makrai
      POSTGRES_PASSWORD: makrai_dev_password
      POSTGRES_DB: makrai_test
      DATABASE_URL: postgresql://makrai:makrai_dev_password@localhost:5432/makrai_test

    services:
      postgres:
        # Same image and superuser name as docker/docker-compose.yml (local
        # dev) and every migration/script that assumes a role called
        # "makrai" -- see the migration comments in
        # prisma/migrations/20260803074244_enable_rls_and_guard_trigger and
        # .../20260803140500_guard_views_and_narrow_default_privileges for
        # why: CREATE EVENT TRIGGER is superuser-only with no GRANTable
        # alternative (D-079), and the postgres image makes POSTGRES_USER a
        # real database superuser on first boot -- no extra bootstrapping
        # needed to get one in CI.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          # Creates "makrai_test" directly at container startup -- the only
          # database this job needs. This pipeline never starts the app (no
          # `next dev`/`next start`, no e2e), and
          # `__tests__/helpers/db.ts#resetDb` hard-refuses to run against
          # anything but "makrai_test", so the interactive-dev database
          # ("makrai") has no reader here at all. Local dev's
          # `npm run db:provision` still provisions both, for a developer
          # who runs the app against "makrai" directly.
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        # GitHub Actions blocks the whole job from starting its steps until
        # this health check passes -- by the time "Checkout" runs, Postgres
        # is already up AND has finished creating POSTGRES_DB (the official
        # image's entrypoint runs init before the server starts accepting
        # the connections this check makes). That is the actual "wait for
        # Postgres" mechanism; a separate pg_isready step earlier in the job
        # would only be able to re-check something already guaranteed, so
        # none is added. Same interval/timeout/retries as
        # docker/docker-compose.yml's own healthcheck -- no reason to run a
        # different check here than the one local dev already relies on.
        # NOTE: literal "makrai" here, not ${{ env.POSTGRES_USER }} -- unlike
        # services.<id>.env (below) and steps.env (used further down for the
        # provisioning step), the `env` context is not available inside
        # `options` (confirmed with actionlint: "context env is not allowed
        # here"). Kept in sync with POSTGRES_USER above by comment, not by
        # mechanism -- the same trade-off already made for DATABASE_URL.
        options: >-
          --health-cmd="pg_isready -U makrai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Reads .nvmrc rather than restating it, so this cannot drift
          # from local dev or the Dockerfile's ARG default (D-192).
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        # Not optional, and not named in the original task order: verified
        # directly against the installed packages
        # (node_modules/prisma/package.json,
        # node_modules/@prisma/client/package.json) that neither carries a
        # `postinstall` hook in this Prisma 7 install -- older Prisma
        # versions generated the client automatically as an `npm install`
        # side effect; this one does not. Without this step, `tsc --noEmit`,
        # `vitest run` and `next build` all fail: every one of them imports
        # from the generated `@prisma/client`, and `prisma migrate deploy`
        # deliberately does not generate as a side effect (unlike
        # `migrate dev`) -- Prisma's own docs recommend calling `generate`
        # explicitly in deploy pipelines for exactly this reason.
        run: npx prisma generate

      # Lint and typecheck need no database, only the generated client above
      # -- so they run before the two Postgres-dependent steps below and
      # fail fast and cheaply on the far more common class of failure
      # (a syntax/type error) before this job pays for 14 migrations and a
      # role-provisioning step. Verified, not assumed: eslint.config.mjs
      # only pulls in eslint-config-next's non-type-checked configs plus
      # this repo's own syntactic rules, so Lint touches no database either.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations (as superuser)
        # Four migrations run CREATE ROLE / CREATE EVENT TRIGGER / ALTER
        # DEFAULT PRIVILEGES and are superuser-only with no GRANTable
        # alternative (D-079) -- DATABASE_URL above already connects as
        # "makrai", the role the postgres image made a superuser at
        # startup.
        run: npx prisma migrate deploy

      - name: Provision makrai_app role password
        # scripts/provision-app-db-role.sh, unmodified in its SQL/quoting
        # logic (still `printf | psql -v pw=`, never string interpolation --
        # see the script's own comment for why that matters). Only HOW it
        # reaches psql is overridable, and this is the one place that
        # override is used: the script's default assumes a local
        # `docker-postgres-1` container to `docker exec` into, which does
        # not exist here -- this is a service container reached over TCP,
        # which needs a password (see the script's own PSQL_CMD comment for
        # why trust-auth doesn't cover this path). PGPASSWORD's value is the
        # same well-known, already-public local-dev value as
        # POSTGRES_PASSWORD above, not a real secret.
        run: scripts/provision-app-db-role.sh makrai_test
        env:
          PSQL_CMD: psql -h localhost -p 5432 -U ${{ env.POSTGRES_USER }}
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
          # APP_DB_PASSWORD deliberately left UNSET: the script's own
          # default ('app_dev_password') is exactly what
          # vitest.config.ts's TEST_APP_DATABASE_URL default expects, and
          # NODE_ENV is not "production" here, so the script's own
          # production guard does not block it.

      - name: Unit + integration tests
        # DATABASE_URL (job-level, above) matches vitest.config.ts's own
        # TEST_DATABASE_URL default exactly
        # (postgresql://makrai:makrai_dev_password@localhost:5432/makrai_test),
        # so no override is needed here: that config only reads
        # TEST_DATABASE_URL/TEST_APP_DATABASE_URL (not
        # DATABASE_URL/APP_DATABASE_URL directly), falling back to
        # identical literals when those are unset.
        run: npm test

      - name: Build
        run: npm run build
        # No DATABASE_URL override needed here even though the job-level
        # value above is still in scope: Plan 1c's lazy-init fix
        # (lib/data/connection.ts's hmrSingleton) means `next build` no
        # longer opens a database connection at import/page-data-collection
        # time, so this step does not depend on DATABASE_URL pointing
        # anywhere real -- verified during Plan 1c to also succeed with no
        # DATABASE_URL set at all ("absent-or-present-and-valid").
        #
        # `next build` also re-typechecks the whole project internally
        # (typescript.ignoreBuildErrors defaults to false, and
        # next.config.ts does not set it) -- genuinely redundant with the
        # dedicated Typecheck step above under THIS job's ordering.
        # Deliberately NOT silenced via ignoreBuildErrors: that setting is
        # read by every `next build` invocation, including
        # docker/Dockerfile's production image build, which runs
        # `npm run build` with no separate tsc gate anywhere in that file
        # (checked directly). Turning it off here would remove Next.js's
        # only type-check from the actual shipped-image build to save a few
        # seconds of CI time -- a worse trade than the duplication it would
        # remove.

  test-e2e:
    name: e2e
    runs-on: ubuntu-latest
    # `verify` (above) budgets 15 min for lint+typecheck+test+build against
    # no browser and no server. This job does all of that PLUS installs a
    # real browser and its OS deps (`playwright install --with-deps`) and
    # drives ~20 real logins through the actual `/login` form and NextAuth's
    # credentials provider once (see the "Build e2e fixture" and "Run e2e
    # suite" steps below for why Playwright is still invoked twice even
    # though those logins now happen only once). 30 min is a backstop for a
    # genuine hang, not a tight budget to tune, same rationale as `verify`'s
    # own timeout comment above.
    timeout-minutes: 30

    # Mirrors `verify`'s env block above (job-level env is not inherited
    # across jobs in GitHub Actions, so this cannot simply reference it) plus
    # the additional values this job's app process needs to actually boot
    # and serve requests, each cited against where it throws if unset.
    env:
      POSTGRES_USER: makrai
      POSTGRES_PASSWORD: makrai_dev_password
      POSTGRES_DB: makrai_test
      DATABASE_URL: postgresql://makrai:makrai_dev_password@localhost:5432/makrai_test
      # lib/data/tenant.ts:125 -- throws if unset. `makrai_app`/
      # `app_dev_password` is scripts/provision-app-db-role.sh's own
      # local-dev/CI default (fires whenever APP_DB_PASSWORD is unset and
      # NODE_ENV != production, both true in this job), matching
      # vitest.config.ts:22-23's TEST_APP_DATABASE_URL default exactly --
      # not a value invented here.
      APP_DATABASE_URL: postgresql://makrai_app:app_dev_password@localhost:5432/makrai_test
      # lib/auth/secret.ts:44-49 -- throws if unset or empty. CI-only value
      # (`openssl rand -base64 32`, matching .env.example's own suggested
      # generation command), not reused anywhere else. Non-empty is the only
      # requirement: @auth/core derives the signing/encryption key via HKDF
      # (node_modules/@auth/core/jwt.js:122, `hkdf("sha256", keyMaterial,
      # salt, ...)`), which has no minimum input-length check anywhere on
      # that path -- checked directly, not assumed.
      NEXTAUTH_SECRET: 'yw7940/SNYL8MfW06ZZk+q5UVqa9pvcHBf4CXgIKoF4='
      # app/api/v1/orgs/[slug]/members/route.ts:105-108 -- throws if unset.
      # W-1 (task-5-brief.md): an unset value here would make the invite
      # POST short-circuit on THIS check before ever reaching Task 3's
      # RESEND_API_KEY mechanism, silently satisfying D-188's fix without
      # exercising it. Any syntactically-plausible address works -- no real
      # inbox is needed, since playwright.config.ts's webServer.env blanks
      # RESEND_API_KEY and lib/email/send.ts:32-37 throws locally before any
      # network call.
      EMAIL_FROM_ADDRESS: ci@example.test
      # NOT part of the brief's own read/write table -- found empirically
      # while confirming this job's server can complete a login at all, not
      # assumed from reading source alone. `npm run start` runs `next
      # start`, which sets NODE_ENV=production internally whenever NODE_ENV
      # is not already set (node_modules/next/dist/bin/next:47,66:
      # `defaultEnv` is 'production' for every subcommand but `dev`).
      # @auth/core's own trustHost default
      # (node_modules/@auth/core/lib/utils/env.js:40-44) is
      # `!!(AUTH_URL ?? AUTH_TRUST_HOST ?? VERCEL ?? CF_PAGES ?? NODE_ENV
      # !== "production")` -- note it reads AUTH_URL, NOT NEXTAUTH_URL, so
      # setting NEXTAUTH_URL alone does not help here. With NODE_ENV=
      # production and none of those set, trustHost defaults false and
      # every auth request throws UntrustedHost
      # (node_modules/@auth/core/lib/utils/assert.js:57).
      # Reproduced live: a real `npm run build && npm run start` under this
      # exact env minus this line made `GET /api/auth/csrf` return HTTP 500
      # (`"There was a problem with the server configuration..."`) with
      # `[auth][error] UntrustedHost: Host must be trusted.` in the server
      # log; adding only `AUTH_TRUST_HOST=true` (no NEXTAUTH_URL) made the
      # same request return HTTP 200 with a real CSRF token. `next dev`
      # (local, non-CI) never hits this: NODE_ENV=development there
      # defaults trustHost true by the same expression, which is why no
      # existing spec or local run surfaced it.
      AUTH_TRUST_HOST: 'true'

    services:
      postgres:
        # Same image/health-check shape as `verify`'s service above; see
        # that block's comments for the superuser/CREATE EVENT TRIGGER
        # rationale (D-079), which applies identically here.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U makrai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        # Same reason as `verify`'s identical step above: this Prisma 7
        # install has no `postinstall` client-generation hook.
        run: npx prisma generate

      - name: Apply migrations (as superuser)
        # Same command as `verify`. Also the writer for the `fv_3_0_0`
        # FrameworkVersion row that every `assessments.frameworkVersionId`
        # foreign key depends on -- inserted by
        # prisma/migrations/20260807102031_framework_registry_and_pin/migration.sql,
        # not by a separate seed step.
        run: npx prisma migrate deploy

      - name: Provision makrai_app role password
        # Same command/env shape as `verify`'s identical step; see that
        # step's comment for why PSQL_CMD/PGPASSWORD are overridden this way
        # in CI (no local `docker-postgres-1` container to exec into) and
        # why APP_DB_PASSWORD is deliberately left unset.
        run: scripts/provision-app-db-role.sh makrai_test
        env:
          PSQL_CMD: psql -h localhost -p 5432 -U ${{ env.POSTGRES_USER }}
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Build
        # Playwright owns the server (playwright.config.ts's `webServer`,
        # Task 1) and, in CI, spawns it with `npm run start` -- which needs
        # this build to already exist. This job must NOT start its own
        # server: `reuseExistingServer` is `false` in CI
        # (playwright.config.ts:19), so a server already occupying port 3000
        # makes Playwright's own port check throw
        # (node_modules/playwright/lib/runner/index.js:821-827).
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build e2e fixture (Playwright 'setup' project)
        # Task 10's `setup` project (playwright.config.ts:53) builds the
        # shared 2-org x 5-role x 2-member fixture and saves 20
        # `storageState` files under the gitignored e2e/fixtures/.auth/.
        # Several specs read e2e/fixtures/manifest.json at MODULE SCOPE, so
        # without this step collection itself dies with ENOENT before any
        # test runs -- verified: `npx playwright test --project=setup
        # --list` exits 0 on a cold checkout; a bare `npx playwright test
        # --list` exits 1.
        run: npx playwright test --project=setup

      - name: Run e2e suite
        # Two invocations are still needed, not one: the `setup` project
        # (previous step) creates the gitignored e2e/fixtures/manifest.json
        # that several specs read at MODULE SCOPE, so collection itself
        # dies with ENOENT before any test runs without it having gone
        # first (see that step's own comment). --project=chromium --no-deps
        # skips re-running `setup` here: `dependencies: ['setup']`
        # (playwright.config.ts:58) would otherwise make Playwright
        # re-execute it before `chromium` -- ~20 avoidable logins -- but
        # --no-deps (node_modules/playwright/lib/program.js:189, "Do not
        # run project dependencies") is safe because the previous step
        # already left every artifact that dependency would have produced
        # (manifest.json + 20 storageState files) on disk in this same job.
        # Verified live, not assumed: with this flag, a real run still
        # reports 48 passed / 1 skipped and `setup` appears in the run's
        # own output exactly once, not twice.
        # --fail-on-flaky-tests (present in this installed version:
        # node_modules/playwright/lib/program.js:177, enforced at
        # node_modules/playwright/lib/runner/index.js:5823) is required, not
        # optional: without it, `retries: 2` (playwright.config.ts:6) means
        # a test that only passes on a retry still reports the RUN as
        # green, measured elsewhere at 96.3% green with a flake fully alive.
        # "Green" here means zero retries consumed.
        run: npx playwright test --project=chromium --no-deps --fail-on-flaky-tests

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# This job is intentionally NOT yet a required status check (branch
# protection, D-193, currently requires only `lint, typecheck, test, build`)
# and this task does not add it as one -- that is a separate, later decision
# (task-5-brief.md's own scope: "Do NOT promote anything to a required
# status check"). D-185's `test.fixme()` quarantine on
# e2e/assessment-flow.spec.ts stays in place so this job can be green on its
# first real runs; D-195 (the registration-rate-limit headroom risk this
# suite runs into) is a separate, still-open row that must be resolved
# before this job is ever made blocking.
