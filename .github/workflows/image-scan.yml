name: Image scan

# Scans, once a day, every image the production host can run:
#
#   - the latest release's `web:` and `migrator:` digests (release.yml), and
#   - the third-party images docker/docker-compose.prod.yml pins by digest
#     (today postgres and nginx).
#
# The run fails on any CRITICAL vulnerability that has a published fix, and a
# failed run reports `/fail` to the dead-man check, so the 7-day critical patch
# window starts the day a fix exists. Unfixed vulnerabilities are ignored on
# purpose: there is nothing to patch to, and a gate that is red for weeks over
# them gets switched off. The one other exception is written down, scoped and
# dated in .github/trivy/postgres.trivyignore.yaml (see the scan step).
#
# The two compose digests are read from the compose file when the job runs and
# never copied here, so the pins in docker/docker-compose.prod.yml stay the only
# place they live (D-13). The only digest in this file is Trivy's own.
#
# Needs a release to exist: until the first v* tag is released there is no
# `web:` line to read, the scan fails, and so does its ping. That is the right
# answer to "nothing is deployable yet" and clears with the first release.
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      scanners:
        description: 'Trivy scanners, comma separated: vuln, secret, misconfig, license'
        type: string
        default: vuln

# `packages: read` is added on the scan job alone, to pull the private release
# images from ghcr.io.
permissions:
  contents: read

# The event name is part of the group so that a manual run never cancels the
# scheduled one, as in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Trivy 0.74.0, by the index digest of ghcr.io/aquasecurity/trivy:0.74.0.
  # Docker Hub and Amazon ECR Public serve the same digest. A container image
  # and not aquasecurity/trivy-action or setup-trivy: on 2026-03-19 every
  # version tag of both actions was rewritten to credential-stealing code, and
  # images referenced by digest were the one thing that was not affected
  # (GHSA-69fq-xp46-6x23). A digest cannot be moved.
  #
  # To move it: pick a release newer than 0.74.0 that GitHub shows as
  # immutable, read its index digest with
  # `docker buildx imagetools inspect ghcr.io/aquasecurity/trivy:<version>`,
  # and check the same digest on a second registry. Dependabot does not read
  # this line.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  SCANNERS: ${{ inputs.scanners || 'vuln' }}

jobs:
  scan:
    name: scan the release and the third-party images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The input reaches Trivy's command line, so only known scanner names get
      # through, whatever a person typed into the dispatch form.
      - name: Check the scanners input
        run: |
          if ! [[ "$SCANNERS" =~ ^(vuln|secret|misconfig|license)(,(vuln|secret|misconfig|license))*$ ]]; then
            echo "::error::scanners must be a comma separated list of vuln, secret, misconfig and license"
            exit 1
          fi

      # The list, one reference per line: the release's two digests first, then
      # every `image:` in the compose file that carries a digest. The release
      # body is editable by anyone with write access, so a line is accepted
      # only in the exact form release.yml writes, for this owner's two
      # packages.
      - name: Collect the images to scan
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc="${OWNER,,}"
          body="$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r')"

          pick() { # $1 = line key, $2 = package name
            local found
            found="$(printf '%s\n' "$body" | grep -E "^$1: ghcr\.io/${owner_lc}/$2@sha256:[0-9a-f]{64}\$" | sed "s/^$1: //" || true)"
            if [ "$(printf '%s' "$found" | grep -c .)" != 1 ]; then
              echo "::error::the latest release must carry exactly one valid '$1:' line"
              exit 1
            fi
            printf '%s\n' "$found"
          }
          web="$(pick web makrai-web)"
          migrator="$(pick migrator makrai-migrator)"

          # Literal references only: `${WEB_IMAGE:?...}` starts with `$` and is
          # skipped, which is right, because the release lines above name it.
          refs="$(sed -n -E 's/^[[:space:]]*image:[[:space:]]*([^[:space:]#$]+@sha256:[0-9a-f]{64}).*$/\1/p' docker/docker-compose.prod.yml)"
          for name in postgres nginx; do
            if ! printf '%s\n' "$refs" | grep -q "^$name:"; then
              echo "::error::docker/docker-compose.prod.yml pins no $name image by digest"
              exit 1
            fi
          done

          { printf '%s\n' "$web" "$migrator"; printf '%s\n' "$refs"; } > "$RUNNER_TEMP/images.txt"
          cat "$RUNNER_TEMP/images.txt"

      # The job token goes into the runner's Docker config, which then holds an
      # entry for ghcr.io and for nothing else. The scan step mounts that file,
      # read-only, into the Trivy container for ghcr.io images only. With no
      # credential flags, Trivy takes a registry's credentials from that file
      # by host name, so the token is offered to ghcr.io alone: not to Docker
      # Hub when postgres and nginx are scanned, and not to mirror.gcr.io, the
      # first place Trivy fetches its vulnerability database from. (The flags
      # --username and --password, or TRIVY_USERNAME and TRIVY_PASSWORD, are
      # sent to every registry Trivy contacts, that mirror included, which is
      # why they are not used.) A Trivy container scanning a ghcr.io image can
      # still fetch the database from ghcr.io with the token; that is ghcr.io.
      - name: Log in to ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin

      # Every image is scanned even after one fails, so a run reports all of
      # them; the step then exits non-zero if any did. A scan that could not
      # run (a pull failed, the database did not download) fails the same way:
      # silence is not a pass. The cache volume lets the vulnerability database
      # download once for the four scans.
      #
      # One exception, and only for the image whose reference starts with
      # `postgres:` (the name docker/docker-compose.prod.yml gives it, read in
      # the collect step): .github/trivy/postgres.trivyignore.yaml, mounted
      # read-only and named by --ignorefile. It excepts CVE-2025-68121 in the
      # Go helper of the pinned postgres image, which has no rebuilt upstream
      # to move to, and it expires 7 days after it was added, when Trivy stops
      # applying it. The release images and nginx get no ignore file, and the
      # flags that decide the exit code are the same for all four.
      - name: Scan the images with Trivy
        run: |
          rc=0
          while IFS= read -r ref; do
            echo "::group::${ref}"
            auth=()
            exception_mount=()
            exception_flag=()
            case "$ref" in
              ghcr.io/*) auth=(--volume "$HOME/.docker/config.json:/root/.docker/config.json:ro") ;;
              postgres:*)
                exception_mount=(--volume "$GITHUB_WORKSPACE/.github/trivy/postgres.trivyignore.yaml:/trivy/postgres.trivyignore.yaml:ro")
                exception_flag=(--ignorefile /trivy/postgres.trivyignore.yaml) ;;
            esac
            if ! docker run --rm "${auth[@]}" "${exception_mount[@]}" --volume trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image \
              --no-progress --image-src remote --scanners "$SCANNERS" "${exception_flag[@]}" \
              --severity CRITICAL --ignore-unfixed --exit-code 1 "$ref"; then
              echo "::error::$ref has a fixable CRITICAL vulnerability, or could not be scanned"
              rc=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/images.txt"
          exit "$rc"

      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io

      # Dead-man check for the daily scan, on the pattern of the one that ends
      # ci.yml: a success ping while the job is green, `/fail` when it is not,
      # and nothing when the schedule has stopped, which is the case this step
      # exists for. Last in the job, with `always()`, so `job.status` carries
      # the verdict of the scan above. Scheduled runs only: a manual run says
      # nothing about whether the schedule is alive. The URL is the check's
      # secret, so it reaches the script as an environment variable. If
      # HC_IMAGESCAN_PING_URL is unset the curl fails and so does the run.
      #
      # The check is Simple, period 1 day, grace 36 h, not a cron time. GitHub's
      # schedule is best-effort and its delay has no bound, so the 36 h grace
      # absorbs a late run, or a dropped day, and silence is reported about 60 h
      # after the last ping. `/fail` is not delayed by the grace: a fixable
      # critical vulnerability alerts the moment the run lands.
      - name: Ping the dead-man check
        if: always() && github.event_name == 'schedule'
        env:
          HC_URL: ${{ secrets.HC_IMAGESCAN_PING_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            url="$HC_URL"
          else
            url="$HC_URL/fail"
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$url"
