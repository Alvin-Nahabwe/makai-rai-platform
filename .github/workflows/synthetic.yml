name: Synthetic journey

# A manual, off-host smoke test: `gh workflow run synthetic.yml`. It answers one
# question during an incident: is it the host or the world? It signs in to
# https://makrai.org as a synthetic account, saves an assessment and reads it back
# (scripts/synthetic-journey.mjs; RL 2.3), from a GitHub runner, which is not the
# host. The same journey runs every hour from the host (ops/host/makrai-synthetic.sh,
# in root's crontab; ops/host/README.md, "Hourly synthetic journey (Task 20b)"). If
# the host's journey is failing, a run here that passes points at the host and its
# network; one that fails as well points at the site, or at the world between.
#
# This workflow never pings anything and has no schedule. The hourly run and its
# dead-man check belong to the host, and the alert drill (a bad
# SYNTHETIC_ASSESSMENT_ID, a failing hourly run, a check that goes down and comes
# back) runs against the host. A run here that pinged would keep a check green while
# the host was dead.
#
# The account belongs to an organisation made for this ("zz Synthetic monitoring
# (not a team)"), and the assessment in it is started and never completed. The
# four SYNTHETIC_* secrets name them. A completed assessment cannot be saved, so
# completing it would turn the save into a 409 and the journey red.
#
# The script prints `step=<name> status=<code>` and nothing else: no body, no
# cookie, no password. A failing journey fails the step and so the run, and the run
# going red is the only signal this workflow gives.
#
# GitHub registers a workflow when it processes a push to the default branch that
# adds or changes this file. If that push is never processed, the file sits on main
# unknown to Actions and `gh workflow run` answers 404; a later push that changes
# this file registers it.
on:
  workflow_dispatch:

# Least privilege: the job reads the repository to get one script. It never
# pushes, comments or touches releases. Production is reached over the network
# with the synthetic account, which is an assessor in one organisation.
permissions:
  contents: read

# One run at a time, and a run in progress is never cancelled: a second manual run
# waits its turn (a third replaces a second that is still waiting) instead of
# cutting the first short and turning it red for a failure in which nothing was
# wrong.
concurrency:
  group: synthetic
  cancel-in-progress: false

jobs:
  journey:
    name: sign in, save and read back
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads .nvmrc rather than restating it, as ci.yml does (D-192).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # The secrets reach the script as environment variables and are never
      # interpolated into the script text. Only this step holds the account and
      # the password. A secret that is unset arrives empty, and the script then
      # fails naming the variable (never a value), so a missing secret turns
      # the run red instead of passing. The step has its own limit, shorter
      # than the job's: a step that times out is a failed step with its own
      # name in the log, where a job that times out is cancelled as a whole.
      - name: Sign in, save and read back
        timeout-minutes: 3
        env:
          BASE_URL: https://makrai.org
          SYNTHETIC_EMAIL: ${{ secrets.SYNTHETIC_EMAIL }}
          SYNTHETIC_PASSWORD: ${{ secrets.SYNTHETIC_PASSWORD }}
          SYNTHETIC_ORG_SLUG: ${{ secrets.SYNTHETIC_ORG_SLUG }}
          SYNTHETIC_ASSESSMENT_ID: ${{ secrets.SYNTHETIC_ASSESSMENT_ID }}
        run: node scripts/synthetic-journey.mjs
