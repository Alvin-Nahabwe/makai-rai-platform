# The one exception the daily image scan (.github/workflows/image-scan.yml) carries. It is handed to
# Trivy for the pinned postgres image and for no other image, and it is time-boxed: Trivy stops
# applying an entry once its `expired_at` has passed, so the scan goes red again on its own.
#
# Rules this file keeps (__tests__/lint/release-and-deploy.test.ts checks them):
#   - an entry names one CVE and the file it is in, never a whole image;
#   - an entry says why, and carries a "# Added: yyyy-mm-dd" comment directly above it;
#   - an entry expires no more than 7 days after it was added, which is the critical patch window.
#
# Removing an entry: when a rebuilt postgres image exists, move the digest in
# docker/docker-compose.prod.yml to it, redeploy, and delete the entry. When the last entry goes,
# delete this file, the `postgres:*` branch of the scan loop, and the tests that read them.
vulnerabilities:
  # Added: 2026-10-14
  - id: CVE-2025-68121
    paths:
      - usr/local/bin/gosu
    statement: >-
      Go standard library v1.24.6, crypto/tls certificate validation (fixed in Go 1.24.13 and 1.25.7),
      found in gosu, the Go helper the postgres image starts the server with. There is no rebuilt
      upstream image to move to: on 2026-10-14 Docker Hub's postgres:16-alpine still resolved to the
      pinned digest.
      gosu makes no TLS connections, so the flaw cannot be reached. This expires with the 7-day
      critical patch window that began on 2026-10-14; the pin is bumped when upstream rebuilds.
    expired_at: 2026-10-21
