# Watches the four places this repository takes third-party code from, and
# opens a pull request when one of them has a newer version. The pull request
# runs the same required checks as any other change, so a bump that breaks the
# build or the tests is visible before anybody merges it.
#
# Security updates (a pull request for an advisory, outside this schedule) are
# a repository setting, not a line in this file: Settings > Advanced Security >
# Dependabot alerts, then Dependabot security updates.
#
# Pinned image digests (docker/docker-compose.prod.yml, docker/Dockerfile) are
# kept beside their tags so that a version update moves both together;
# __tests__/lint/compose-image-pins.test.ts fails if a digest goes missing.
#
# Major versions of `postgres` and `node` are ignored in the two image
# ecosystems. A new Postgres major cannot start on a data directory written by
# the previous one, so the bump would take the database down on the next
# `up -d`; a Node major moves the runtime and is made deliberately, together
# with .nvmrc. Minor, patch and digest updates of both still arrive.
#
# npm: every minor and patch update arrives as ONE pull request a week (the
# `npm-minor-patch` group), and every major is ignored. A major moves the
# toolchain or the runtime types (TypeScript 5 -> 7, vitest 4 -> 5 and
# @types/node 20 -> 26 were proposed) and is made by hand, with its own review.
# @types/node is also held below the Node major after the one in .nvmrc. That
# is redundant while every major is ignored; it keeps the types from running
# ahead of the runtime if that rule is ever narrowed. The floor is derived
# from .nvmrc by dependency-surveillance.test.ts.
#
# github-actions: minor and patch updates are ONE pull request a week. Action
# majors are not ignored: each is reviewed on its own pull request.
#
# Security updates are not held back by `update-types` ignores, so a fix that
# exists only in a new major still gets its own pull request (dependabot-core,
# config/ignore_condition.rb: `return versions if security_updates_only`).
# A `versions` ignore does apply to them: a fix only in @types/node >=23
# would get no pull request.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
