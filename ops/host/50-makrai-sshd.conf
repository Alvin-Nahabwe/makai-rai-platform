# Key, then TOTP code, for every login (ADR-0010; OD I.5).
# PermitRootLogin must be yes: prohibit-password disables keyboard-interactive for root.
AuthorizedKeysFile .ssh/authorized_keys
PubkeyAuthentication yes
KbdInteractiveAuthentication yes
PasswordAuthentication no
UsePAM yes
PermitRootLogin yes
AuthenticationMethods publickey,keyboard-interactive:pam
# VERBOSE for the nightly audit reconcile (Task 22): at INFO, OpenSSH 9.6 logs only the final
# Accepted keyboard-interactive line, which names no key; VERBOSE adds the Partial publickey line
# with the key's fingerprint, which the reconcile checks against /etc/makrai/allowed-keys.fp.
LogLevel VERBOSE
