# docker/nginx/default.conf
#
# The domain is makrai.org, confirmed by the project owner on 2026-08-18.
# It is an apex domain, not a subdomain of an institutional zone, so adding it
# to Cloudflare moves nameservers only for a zone this project controls.
#
# TLS: a Cloudflare Origin CA certificate, installed 2026-08-29, valid to
# 2041-08-25. NOT Let's Encrypt, and the paths below say so deliberately --
# they used to read /etc/letsencrypt/live/makrai.org/, a directory name that
# would have had the next reader looking for a certbot installation that does
# not exist and cannot work here.
#
# Certbot is ruled out structurally, not by preference: its HTTP-01 challenge
# arrives on port 80, which the server block below redirects to HTTPS (and drops
# outright unless the connection is Cloudflare's), and the HTTPS leg needs the
# certificate the challenge is trying to obtain. Origin CA has no ACME step, no
# renewal cron and no nightly nginx restart. Browsers do not trust it, which is
# irrelevant because browsers only ever talk to Cloudflare -- but it does mean
# the DNS record cannot go back to grey without breaking the site.

# Restore the real client address, BEFORE anything below consumes it.
#
# Every request now arrives from a Cloudflare edge, so without this
# `$remote_addr` and `$binary_remote_addr` are Cloudflare's address, not the
# visitor's. That silently breaks two things at once:
#
#   1. `X-Real-IP` forwarded to the app.
#   2. `X-Forwarded-For`, which is what proxy.ts reads for rate-limit and audit
#      identity.
#
# nginx itself limits nothing by address: no sign-in limit may key on the
# client address (SRS FR-ACC-05, NFR-SEC-06, ruling 10), not even a flood
# ceiling (call R-49). Many people sign in from one institutional address.
#
# `set_real_ip_from` lists the addresses whose `CF-Connecting-IP` we accept.
# THE LIST IS THE SECURITY BOUNDARY: an address not on it cannot influence
# `$remote_addr` at all. Cloudflare overwrites `CF-Connecting-IP` on every
# request it proxies, so a client-supplied value never survives the edge.
#
# Fetched 2026-08-29 from https://www.cloudflare.com/ips-v4 and /ips-v6.
# Cloudflare adds ranges occasionally; a stale list here means requests from a
# new range keep Cloudflare's address and collapse into one bucket, silently.
# The list exists in exactly two places, one per repository: here, and
# HETZNER_FIREWALL_SETUP.md §4 in toolkit-process, which is the same list used
# for the Hetzner firewall rules. Nothing can check those two against each
# other in CI -- neither repo checks the other out -- so they are updated
# together by hand. `__tests__/lint/nginx-cloudflare-ranges.test.ts` guards the
# half that IS checkable: that this list is well-formed and complete-looking,
# and that the headers below have not drifted back.
#
# Here it is written twice: as the `set_real_ip_from` lines below, and again as
# the `geo $from_cloudflare` block further down, which decides who is admitted at
# all. `__tests__/lint/nginx-origin.test.ts` fails if the two differ.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Not X-Forwarded-For: that header is a client-writable list, and trusting it
# would mean parsing an attacker-influenced chain. CF-Connecting-IP is a single
# value Cloudflare sets itself, and it is the only header this origin trusts.
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# Do not announce the nginx version in the Server header or on error pages.
# Top level, not inside a server block: this file is included in the http
# context, so one directive here covers every server below, the port-80 redirect
# and the default block included.
server_tokens off;

# Admit only Cloudflare. CF-Connecting-IP feeds the rate-limit zones, `X-Real-IP`
# and the `X-Forwarded-For` that proxy.ts reads, and it can be believed only when
# the request really came through Cloudflare. nginx makes that check itself,
# rather than relying on anything in front of the host.
#
# Keyed on `$realip_remote_addr`, the address of the TCP peer, and NOT on
# `$remote_addr`: the realip module above has already rewritten `$remote_addr` to
# the visitor's address, so an `allow`/`deny` list of Cloudflare ranges would
# compare the visitor against Cloudflare and refuse every real user. Do not add
# `allow` or `deny` to this file.
#
# The ranges are the `set_real_ip_from` list again, and
# `__tests__/lint/nginx-origin.test.ts` keeps the two equal. Each makrai.org
# server below answers a 0 with `return 444`, which closes the connection without
# a response.
geo $realip_remote_addr $from_cloudflare {
    default 0;

    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;

    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# What the access log may say. Invitation links carry a bearer token in the path
# (/invitations/<token>, /api/v1/invitations/<token>[/...]), so the logged path
# replaces it. `$uri` has no query string; the format below also leaves out the
# user agent, the referer and the full request line, which has one. Nothing in a
# log line can then be an email address or a secret.
map $uri $log_uri {
    ~^(?<p>/(api/v1/)?invitations/)[^/]+(?<r>.*)$ $p[token]$r;
    default $uri;
}

log_format makrai '$remote_addr - [$time_iso8601] "$request_method $log_uri $server_protocol" $status $body_bytes_sent $request_time';

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name makrai.org;

    # Before the `return`: directives from the rewrite module run in the order
    # written and the first `return` ends the request, so a gate below the
    # redirect would never run. In the server block, never in a location.
    if ($from_cloudflare = 0) {
        return 444;
    }

    # Per server: this overrides the image's http-level "main" log; an http-level "makrai" one would add to it.
    access_log /var/log/nginx/access.log makrai;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name makrai.org;

    # Only Cloudflare may be answered (see the geo block). First, and at server
    # level: a location is reached only after the origin has chosen to respond.
    if ($from_cloudflare = 0) {
        return 444;
    }

    access_log /var/log/nginx/access.log makrai;

    # SSL certificates (Let's Encrypt / Certbot)
    ssl_certificate     /etc/ssl/makrai/fullchain.pem;
    ssl_certificate_key /etc/ssl/makrai/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers. THIS BLOCK IS THE ONLY PLACE they are set: next.config.ts
    # sets none (its poweredByHeader is off too), so each reaches the browser once.
    #
    #   * `always` on every line: without it nginx omits the header on 4xx and
    #     5xx responses, which are exactly the pages a hostile request lands on.
    #   * Server level only. nginx drops EVERY inherited add_header in a
    #     `location` that declares its own, silently, so one add_header in any
    #     location below would strip all six from that location's responses.
    #     Do not add one there. __tests__/lint/security-headers.test.ts fails on it.
    #
    # The policy allows no eval, no third-party origin and no framing. Fonts are
    # self-hosted by next/font at build time, so font-src 'self' is enough.
    # 'unsafe-inline' stays in script-src and style-src for now: the root layout
    # carries an inline theme-init script and components set inline style
    # attributes.
    # e2e/csp.spec.ts loads every page route under this exact policy in CI.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Client upload limit
    client_max_body_size 10m;

    # Reverse proxy to Next.js
    location / {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, not $proxy_add_x_forwarded_for. Appending would preserve
        # whatever the client sent ahead of the real address, and proxy.ts
        # reads the FIRST element -- so an appended chain hands identity
        # straight back to the client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support (Next.js HMR in dev)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Every other name is refused. nginx hands a request to the server whose
# server_name matches its Host header, and to the default_server for the
# address:port when none does. This block is that default_server, the only one
# per address:port, so a request for any name the origin does not serve is dropped
# here and never reaches the app.
#
# `ssl_reject_handshake on` refuses the TLS handshake for an unrecognised name
# (or none, as when someone connects to the bare IP), so this block needs no
# certificate. `return 444` drops a plain-HTTP request without a response.
#
# This block sends no response, so it needs no add_header. It names its own
# access_log for the reason given in the port-80 block.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    access_log /var/log/nginx/access.log makrai;
    return 444;
}
