# MAK-AI RAI Toolkit — security audit trail retention (DEP-07).
#
# INSTALLED TO: /etc/systemd/journald.conf.d/99-makrai.conf on the production
# host, followed by `systemctl restart systemd-journald`. It is kept here so
# that the retention decision is reviewable and version-controlled rather than
# living only as undocumented host state. See docs/runbooks/deployment.md.
#
# Pairs with docker/docker-compose.prod.yml, whose four services set
# `logging: driver: journald`. That file decides WHERE container output goes;
# this file decides HOW LONG it is kept. Neither works alone.
#
# Why this exists: lib/security-logger.ts writes the audit trail — logins,
# lockouts, admin actions, membership changes, evidence uploads — as JSON to
# stdout. Docker's default json-file driver stores that stream under the
# container's own directory, which is DELETED when the container is removed,
# and `docker compose up -d --build` removes it on every redeploy. The size
# caps already present in /etc/docker/daemon.json bound that file but never
# made it outlive the container, and json-file has no time-based rotation at
# all, so a retention period cannot be expressed there even in principle.

[Journal]

# Survive reboots, not merely container recreation. /var/log/journal already
# existed on this host so this was already the effective behaviour; it is
# stated explicitly so that the Storage=auto default cannot silently turn the
# journal volatile if that directory is ever lost.
Storage=persistent

# The retention decision: 90 days.
MaxRetentionSec=90day

# Retention is only applied when a journal file is ROTATED, and a file is only
# removed once every entry in it is older than MaxRetentionSec. Left at the
# 1-month default, a single file could therefore hold entries for roughly 120
# days — longer than the period we state. Daily files bound that overshoot to
# a day. This matters because the retention period is a promise about other
# organisations' personal data, so overshooting it is the direction that costs
# something, not the safe one.
MaxFileSec=1day

# Disk ceiling. The journal shares this disk with the Postgres volume and the
# backups, so it gets an explicit cap rather than journald's default of 10% of
# the filesystem (~7.5G here). Measured before setting: 16 days of system logs
# occupied 115M, so 90 days of system output plus this deployment's container
# output sits far below 2G. This is a runaway backstop, not a working limit.
# SystemKeepFree is the second belt — whatever else happens, never crowd out
# Postgres or a backup run.
SystemMaxUse=2G
SystemKeepFree=5G

# Rate limiting DISABLED, deliberately. This is the least obvious setting here
# and the one most likely to be "tidied up" later, so: journald silently
# DISCARDS messages when a single service exceeds RateLimitBurst (default
# 10000 per 30s). For ordinary application logs that is sensible protection.
# For an audit trail it means a burst of failed logins — precisely the moment
# the record matters most — could be partly discarded with no error raised and
# no marker left in the journal to say anything went missing.
#
# Silent loss is the worse failure mode for this data, so the cap comes off and
# SystemMaxUse above carries the disk risk instead. The trade accepted here is
# explicit: a log storm can now evict old entries early by filling the cap,
# which is a visible, measurable failure, rather than dropping entries
# invisibly during exactly the incident you would later be investigating.
RateLimitBurst=0

# One copy, one policy. Forwarding was ON via
# /usr/lib/systemd/journald.conf.d/syslog.conf, which duplicated every entry
# into /var/log/syslog under logrotate's own separate and shorter schedule —
# a second copy of personal data that the 90-day statement above did not
# describe or control.
#
# Checked before disabling, because fail2ban is active on this host and
# breaking SSH brute-force protection to tidy up log duplication would be a
# bad trade: the only jail (sshd) reports `No file is currently monitored` and
# matches on `_SYSTEMD_UNIT=sshd.service + _COMM=sshd`, i.e. it reads the
# journal directly. Nothing else on the host consumes /var/log/syslog.
#
# THIS LINE DOES NOT WORK ON ITS OWN, and the reason is worth reading before
# "simplifying" the install step in docs/runbooks/deployment.md.
#
# systemd orders drop-ins by FILENAME across every directory it searches — it
# does NOT rank /etc above /usr/lib except for files of the SAME name. The
# vendor drop-in is /usr/lib/systemd/journald.conf.d/syslog.conf, and
# "syslog.conf" sorts after "99-makrai.conf", so on first install the vendor
# file was applied last and its ForwardToSyslog=yes won outright.
#
# That failed silently: every setting above took effect, `systemctl restart
# systemd-journald` reported success, and the file looked correct. It was
# caught only by an end-to-end check — `logger` a unique marker, then count it
# in the journal and in /var/log/syslog. It appeared in both (1 and 1), which
# is the observation that says forwarding is still on. After masking, the same
# check returns 1 and 0.
#
# The fix is systemd's documented masking mechanism, and it is a required part
# of installing this file:
#
#     ln -sf /dev/null /etc/systemd/journald.conf.d/syslog.conf
#
# A same-named file in /etc overrides the one in /usr/lib regardless of sort
# order, and a symlink to /dev/null disables it entirely. Masking rather than
# renaming this file to sort last is deliberate: "sorts after syslog.conf"
# would be a property no one can see from here, and the next vendor drop-in
# could quietly outrank it again.
ForwardToSyslog=no
