# docker/docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-makrai}
      POSTGRES_USER: ${POSTGRES_USER:-makrai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-makrai_dev_password}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-makrai}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
