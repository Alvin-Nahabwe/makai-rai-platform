# docker/docker-compose.prod.yml
# Production Docker Compose with Nginx reverse proxy + SSL

services:
  nextjs:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The RLS-scoped connection, and the reason this list is not optional.
      # lib/data/connection.ts#requireDatabaseUrl THROWS when this is unset,
      # deliberately: pg would otherwise fall back to PG* environment variables
      # and libqp defaults, "which can land on the schema owner and bypass RLS
      # entirely" (ADR-0001). Absent this line the container starts and then
      # refuses every tenant-scoped query -- the refusal is the control working,
      # not a bug. It must point at makrai_app, never the owner role.
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Without this, production login is not degraded -- it is impossible.
      # @auth/core defaults trustHost to
      #   !!(AUTH_URL ?? AUTH_TRUST_HOST ?? VERCEL ?? CF_PAGES ?? NODE_ENV !== "production")
      # (node_modules/@auth/core/lib/utils/env.js:40-44). The runner image sets
      # NODE_ENV=production (docker/Dockerfile:33) and none of the others, so
      # trustHost is false and assertConfig returns UntrustedHost for EVERY auth
      # request (@auth/core/lib/utils/assert.js:56-58). Note the expression reads
      # AUTH_URL, not the NEXTAUTH_URL above -- setting that alone does not help.
      # CI proved both directions against a real build: /api/auth/csrf returned
      # 500 without this and 200 with it (.github/workflows/ci.yml:288-311).
      #
      # SAFE ONLY AS A PAIR WITH NEXTAUTH_URL ABOVE. This tells auth to stop
      # rejecting by Host; NEXTAUTH_URL is what stops it *deriving* its origin
      # from the Host header, since createActionURL falls back to
      # x-forwarded-host only when no origin is pinned (@auth/core env.js:66-86).
      # nginx forwards the client's Host verbatim and declares no default_server,
      # so unpinning this would build every callback URL from attacker input.
      # __tests__/lint/prod-env-completeness.test.ts enforces the pair.
      AUTH_TRUST_HOST: 'true'
      # Self-service registration. PLAN.md D9 rules it invite-gated until T3,
      # and lib/auth/openRegistration.ts opens only on the exact string 'true',
      # so leaving this empty keeps it shut. Passed explicitly rather than
      # omitted so that reopening at T3 is a .env edit, and so an operator
      # reading this file can see the control exists -- the previous comment
      # here asserted the gate while no gate existed (D-253).
      ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-}
      # How many organizations one account may own (D-107). Empty uses the
      # code's default of 5, which is generous for a researcher affiliated with
      # several institutions and useless for bulk slug squatting. Raising it for
      # a genuine case is a .env edit, not a release.
      ORG_LIMIT_PER_USER: ${ORG_LIMIT_PER_USER:-}
      # Invitation email. This comment used to assert "Registration is
      # invite-gated (D9)" as though it were implemented. It was not: until
      # 2026-08-29 `app/api/auth/register/route.ts` accepted any well-formed
      # POST from anyone on the internet, and the claim described a different
      # route. It is now true, enforced by ALLOW_OPEN_REGISTRATION below --
      # which is absent here on purpose, because absent means closed.
      #
      # Invitation email. Registration is invite-gated (PLAN.md D9), so without these
      # an invite still returns 201 with a working acceptUrl and logs
      # `invite_email_failed` -- the inviter must then send the link by hand.
      # app/api/v1/orgs/[slug]/members/route.ts:105 reads EMAIL_FROM_ADDRESS and
      # throws if it is empty; the throw is caught deliberately so a failed
      # email leg never costs the inviter the link that already exists.
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
    depends_on:
      postgres:
        condition: service_healthy
    # Send this container's output to the HOST journal instead of the
    # container's own json-file. The default driver writes to
    # /var/lib/docker/containers/<id>/<id>-json.log, which docker deletes when
    # the container is removed -- and `up -d --build` removes it on every
    # redeploy, so the audit trail in lib/security-logger.ts was destroyed each
    # time the app was updated (DEP-07). Size caps in /etc/docker/daemon.json
    # bound the file but do not outlive it, and json-file has no time-based
    # rotation, so a retention period cannot be expressed there at all.
    #
    # Retention lives on the HOST, not here: /etc/systemd/journald.conf.d/
    # 99-makrai.conf sets Storage=persistent, MaxRetentionSec=90day and a disk
    # cap. This file only decides WHERE the stream goes; that file decides how
    # long it is kept. __tests__/lint/compose-log-persistence.test.ts pins this
    # half, docs/runbooks/deployment.md documents the other.
    logging:
      driver: journald
      options:
        # Without a tag every container's entries land under the same truncated
        # container id, and `journalctl CONTAINER_TAG=makrai/docker-nextjs-1`
        # cannot separate the app's audit trail from postgres and nginx noise.
        tag: 'makrai/{{.Name}}'
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Host journal, not a container-owned file -- see the nextjs service above
    # for why (DEP-07). Applied here too so a redeploy does not silently leave
    # one service's output on the losing driver.
    logging:
      driver: journald
      options:
        tag: 'makrai/{{.Name}}'
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # The Cloudflare Origin CA certificate and key. Read-only, and named for
      # what it holds -- this was /etc/letsencrypt until 2026-08-29, which
      # described a certbot layout this deployment does not and cannot use.
      - /etc/ssl/makrai:/etc/ssl/makrai:ro
    depends_on:
      - nextjs
    # Host journal, not a container-owned file -- see the nextjs service above
    # for why (DEP-07). Applied here too so a redeploy does not silently leave
    # one service's output on the losing driver.
    logging:
      driver: journald
      options:
        tag: 'makrai/{{.Name}}'
    restart: unless-stopped

  # Short-lived migration and seed runner. Behind the `tools` profile so that
  # `docker compose up` never starts it; reach it only with an explicit
  # `--profile tools run --rm migrator`. See docs/runbooks/deployment.md 4.5.
  # It exists because neither `prisma` nor `tsx` reaches the serving image --
  # docker/Dockerfile's migrator stage explains why in full.
  migrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrator
    profiles: ['tools']
    environment:
      # Owner role: migrations create tables and policies, which makrai_app is
      # deliberately not permitted to do.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The seed is not plain SQL -- prisma/seed.ts imports lib/data/identity and
      # lib/data/preauth, so it runs the same connection code the app does and
      # trips requireDatabaseUrl without this.
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_ORG_NAME: ${ADMIN_ORG_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    # A migration run that fails must stay failed and visible, never be retried
    # into a half-applied state by the daemon.
    # Host journal, not a container-owned file -- see the nextjs service above
    # for why (DEP-07). Applied here too so a redeploy does not silently leave
    # one service's output on the losing driver.
    logging:
      driver: journald
      options:
        tag: 'makrai/{{.Name}}'
    restart: 'no'

volumes:
  postgres_data:
